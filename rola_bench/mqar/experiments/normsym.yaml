# Norm × routing ablation (the asym>sym v1 result): 3 norms (global / per_state / kappa) ×
# 2 routings (asym=untied / sym=tied) × nc {16,64,256} × 4 LR, at the fixed RoLA geometry.
project_name: rola-normsym-resweep
backbone: {d_model: 128, vocab: 8192, n_layers: 2, l_max: 1024}
data:     {preset: ext, train_batch: 128, test_batch: 8, cache_dir: /tmp/zoology_cache_rwext}
train:
  max_epochs: 40
  weight_decay: 0.0
  seed: 1337
  early_stopping_threshold: 2.0
  early_stopping_metric: valid/accuracy
  slice_keys: [num_kv_pairs]
  eval_every: 10
lrs: [0.001, 0.003, 0.01, 0.03]            # bracket the RLA optimum (~1e-2)
ncs: [16, 64, 256]
_routed: &routed {build: routed, d_qk: 12, d_v: 12, n_heads: 4,
                  run_id: "normsym-{tag}-nc{nc}_lr{lr:.0e}_s{seed}"}
tiers:
  all:
    - {<<: *routed, tag: g_asym,  instance: rola-rla-asym}
    - {<<: *routed, tag: g_sym,   instance: rola-rla-sym}
    - {<<: *routed, tag: ps_asym, instance: rola-rla-asym-ps}
    - {<<: *routed, tag: ps_sym,  instance: rola-rla-sym-ps}
    - {<<: *routed, tag: k_asym,  instance: rola-rla-kappa-asym}
    - {<<: *routed, tag: k_sym,   instance: rola-rla-kappa-sym}
fleet: {batch: 6, per_batch_timeout: 10800}   # 72 short cells — batch several per box
