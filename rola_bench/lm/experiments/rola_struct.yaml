# RoLA STRUCTURE smoke (1-seed, separate host group). Head vs d_v split at FIXED nh*d_v=256 (= hidden,
# so no output bottleneck) and fixed nc=32/d_qk=16 -> every variant is half-KV state at block_size=512
# (131072 floats/layer) AND iso-PARAM.
# Isolates "fewer heads + bigger d_v" vs "more heads". nh8/dv32 is the main run's rola-rla-kappa-asym
# (compare to it; not re-run here). nh2/dv128 is the extreme (d_v=128 stresses the routed kernel).
# launch.py lm rola_struct
arms:  [rola-rla-kappa-asym__nh16_dv16, rola-rla-kappa-asym__nh4_dv64, rola-rla-kappa-asym__nh2_dv128]
seeds: [1337]
backbone: {hidden: 256, layers: 6, max_pos: 2048}
geometry: {rola_nc: 32, rola_dqk: 16, rola_dv: 32, rola_nh: 8, attn_heads: 4,
           qk_norm: true, router_bias: true, router_zloss_coef: 0.0}
budget:
  lr: 3e-4
  max_steps: 15000
  block_size: 512
  batch_size: 32
  grad_accum: 1
  dataset: roneneldan/TinyStories
  dataset_config: ""
  grad_ckpt: 0
  save_steps: 1500
fleet:
  image: blakeresearch/rola-lm:v4
  idle_timeout: 1800
  batch: 1
  per_batch_timeout: 10800   # 3h hang-backstop; close monitoring is primary
  no_kill: true
  pull_in_progress: true
  live_pull_every: 900
