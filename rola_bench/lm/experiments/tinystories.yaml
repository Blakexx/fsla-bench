# Small-scale LM — TinyStories. ~30M backbone (hidden 256, 6 layers), per-corpus L/nc/batch/seeds,
# 15k steps, RoLA + matched-state GDN/GLA + attention. qk-norm on, z-loss off.
# launch.py lm tinystories
arms:  [rola-rla-kappa-asym, rola-rla-kappa-asym-conv, rola-rla-kappa-sym,
        rola-gla-kappa-asym, rola-gla-kappa-asym-conv, rola-gla-kappa-sym,
        gdn, gla, attn]
seeds: [1337, 2024, 11, 42, 7]
backbone: {hidden: 256, layers: 6, max_pos: 2048}
# Bounded linear-attention arms match half of attention KV at block_size=512, hidden=256:
# target = 131072 floats/layer.
geometry: {rola_nc: 32, rola_dqk: 16, rola_dv: 32, rola_nh: 8, attn_heads: 4,
           gdn_nh: 8, gdn_head_dim: 128, gdn_expand_v: 1.0, gla_nh: 4, gla_ek: 4.0, gla_ev: 2.0,
           qk_norm: true, router_zloss_coef: 0.0}
budget:
  lr: 3e-4
  max_steps: 15000
  block_size: 512
  batch_size: 32
  grad_accum: 1
  dataset: roneneldan/TinyStories
  dataset_config: ""
  grad_ckpt: 0
  save_steps: 1500
fleet:
  image: blakeresearch/rola-lm:v5
  idle_timeout: 1800
  batch: 1
  per_batch_timeout: 10800   # 3h hang-backstop (normal cell ~40-60min); close monitoring is primary
  no_kill: true
  pull_in_progress: true
  live_pull_every: 900
