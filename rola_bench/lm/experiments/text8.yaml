# Small-scale LM — text8 (char-level long-range; metric = bits-per-char, auto via is_char). ~30M
# backbone (hidden 256, 6 layers), 15k steps, RoLA + matched-state GDN/GLA + attention.
# qk-norm on, z-loss off. Bounded linear-attention arms match half of attention KV at block_size=2048,
# hidden=256: target = 524288 floats/layer. launch.py lm text8
arms:  [rola-rla-kappa-asym, rola-rla-kappa-sym, rola-gla-kappa-asym, rola-gla-kappa-sym, gdn, gla, attn]
seeds: [1337, 2024, 11]
backbone: {hidden: 256, layers: 6, max_pos: 2048}
geometry: {rola_nc: 128, rola_dqk: 16, rola_dv: 32, rola_nh: 8, attn_heads: 4,
           gdn_nh: 8, gdn_head_dim: 128, gdn_expand_v: 4.0, gla_nh: 4, gla_ek: 4.0, gla_ev: 8.0,
           qk_norm: true, router_zloss_coef: 0.0}
budget:
  lr: 3e-4
  max_steps: 15000
  block_size: 2048
  batch_size: 8
  grad_accum: 1
  dataset: text8
  dataset_config: ""
  grad_ckpt: 0
  save_steps: 1500
fleet:
  image: blakeresearch/rola-lm:v3
  idle_timeout: 1800
  batch: 1
  per_batch_timeout: 43200
  no_kill: true
  pull_in_progress: true
  live_pull_every: 900
