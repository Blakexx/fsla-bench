# RoLA SCALING curves — per-architecture characterization (RoLA rla+gla vs attention ONLY; this is
# NOT a matched-state comparison — verdicts live in the comparison bench). Every other baseline
# (GDN/GLA/zoo) is the same complexity class as RoLA, so it would be a parallel line; attention is the
# only baseline that scales differently in L (O(L^2)/growing-KV), so scaling = RoLA vs attn.
#
# Each bench-TYPE is its OWN fleet run_id (perf-scaling-train / -prefill / -decode), so you can launch
# ANY SUBSET by editing the `benches` list — e.g. `benches: [scaling-decode]` runs just the
# recurrent/decode curves on ONE box. Axes: L × X% (state as % of attn KV cache -> nc) × d_qk,
# square d_qk=d_v. PERF_B=2 so long L fits; OOM at the (large nc, large L) corner is expected
# frontier (sentinel rows, not failures).  launch.py perf scaling_curves
benches: [scaling-train, scaling-prefill, scaling-decode]
reps: 10
fleet:
  offer_query: "gpu_name=A100_PCIE num_gpus=1 rentable=true reliability>0.97 inet_down>500 inet_down_cost<0.01 inet_up_cost<0.01"
  idle_timeout: 1800              # 30m — warm of 78-114 shapes is a long SILENT codegen pass; 900s risked
                                  # reaping the box mid-warm (a likely v24 train/prefill killer). v26's
                                  # affinity-aware worker count makes warm much faster, but keep headroom.
  batch: 1
  per_batch_timeout: 10800        # 3h — long-L attn (O(L^2)) train cells are slow by design
  env:
    # No blanket SCALE_LENS -> each bench-type uses its FRONTIER ceiling (run_perf._DEFAULT_LENS):
    #   decode  -> 1M  (RoLA flat vs attn linear-growing KV — the headline "RoLA wins" plot)
    #   prefill -> 128k (attn O(L^2) blowup vs RoLA O(L))
    #   train   -> 64k  (backward + nb_tile memory-bound; OOM sentinels past it)
    # Override per type with SCALE_LENS_DECODE / _PREFILL / _TRAIN, or a blanket SCALE_LENS.
    SCALE_XS: "10,25,50,100"
    SCALE_DQKS: "16,64,128"
    PERF_B: "2"
