# engine_regression — internal CuTe-vs-Triton engine bake-off (ENGINEERING / merge-decision only,
# NOT paper material). Cross-engine `engine_bench.py` cells at the RoLA-base geometry (square
# topology D=2/b=16, H=8, d_qk=16, d_v=64), comparing worktrees (rola-triton vs rola-cute) on
# identical shapes. See rola_bench/perf/METHODOLOGY.md ("Cross-engine comparison").
#
# `--worktree` IS set per cell here (unlike paper_v1, which leaves it unset to resolve from the
# image's pip-installed fla_rola) -- this yaml's whole point is comparing two DIFFERENT worktrees in
# the same run, so each cell pins one explicitly via ROLA_ENGINE_WORKTREE overrides is not enough
# (both cells would resolve the same env var); instead this experiment is meant to be launched TWICE,
# once per image built from each engine worktree (see the `fleet.image` comment below) -- the
# `engine_cells` themselves stay worktree-agnostic (empty `worktree` -> resolves from whichever image
# is running), and you diff the two runs' results/perf/engine_regression/*.json externally.
#
# Launch (once per engine image):
#   python -m rola_bench.fleet perf engine_regression --boxes 1

benches: [engine-bench]
reps: 20

engine_cells:
  - name: rola-base-fwd-l4k
    levels: 2
    b: 16
    H: 8
    d_qk: 16
    d_v: 64
    kernel: gla_scalar
    state_norm: kappa
    L: 4096
    B: 4
  - name: rola-base-fwd-l16k
    levels: 2
    b: 16
    H: 8
    d_qk: 16
    d_v: 64
    kernel: gla_scalar
    state_norm: kappa
    L: 16384
    B: 2
  - name: rola-tied-fwd-l4k
    levels: 2
    b: 16
    H: 8
    d_qk: 16
    d_v: 64
    kernel: gla_scalar
    state_norm: kappa
    tied: true
    L: 4096
    B: 4
  - name: rola-tied-fwd-l16k
    levels: 2
    b: 16
    H: 8
    d_qk: 16
    d_v: 64
    kernel: gla_scalar
    state_norm: kappa
    tied: true
    L: 16384
    B: 2

fleet:
  # Build this image from the engine worktree under test (rola-cute vs rola-triton) and re-launch to
  # compare -- e.g. `docker/build.sh perf --engine-worktree rola-triton` vs the default rola-cute image.
  image: "blakeresearch/rola-bench:v40"
  offer_query: "gpu_name=A100_PCIE num_gpus=1 rentable=true reliability>0.97 inet_down>500 inet_down_cost<0.01 inet_up_cost<0.01"
  idle_timeout: 1800
  batch: 1
  per_batch_timeout: 10800
