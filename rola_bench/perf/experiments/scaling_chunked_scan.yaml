# Chunked forward scaling run for the kappa scan-kernel FLA commit.
#
# FLA source expected in image:
#   /home/blake/flash-linear-attention-rola-proto @ 37b96617
#
# Launch:
#   python launch.py perf scaling_chunked_scan --boxes 1
benches: [scaling-prefill]
reps: 15
fleet:
  image: "blakeresearch/rola-bench:v37"
  offer_query: "gpu_name=A100_PCIE num_gpus=1 rentable=true reliability>0.97 inet_down>500 inet_down_cost<0.01 inet_up_cost<0.01"
  idle_timeout: 1800
  batch: 1
  per_batch_timeout: 10800
  env:
    SCALE_NCS: "16,64,256,1024"
    SCALE_DQKS: "16,64,128"
    SCALE_ROUTINGS: "flat,square,tree"
    PERF_B: "2"
