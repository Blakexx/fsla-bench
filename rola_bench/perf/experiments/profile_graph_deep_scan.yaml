# Diagnostic graph profiles for the kappa scan-kernel FLA commit.
#
# FLA source expected in image:
#   /home/blake/flash-linear-attention-rola-proto @ 37b96617
#
# Launch:
#   python launch.py perf profile_graph_deep_scan --boxes 1 --batch 1
benches: [profile-graph]

profiles:
  - name: "v37_scan_rla_l131k_d16_nc64_square"
    arm: "rola"
    L: 131072
    batch: 2
    d_qk: 16
    nc: 64
    routing: "square"
    warmup: 1
    reps: 1
    torch_profiler: true
    deep_profile: "ncu"
    deep_kernel_name: ".*kappa_fwd_scan_cb_atomic.*"
    deep_launch_skip: 0
    deep_launch_count: 1
    deep_ncu_set: "basic"
    deep_timeout: 1800

  - name: "v37_scan_rla_l131k_d16_nc256_square"
    arm: "rola"
    L: 131072
    batch: 2
    d_qk: 16
    nc: 256
    routing: "square"
    warmup: 1
    reps: 1
    torch_profiler: true
    deep_profile: "ncu"
    deep_kernel_name: ".*kappa_fwd_scan_cb_atomic.*"
    deep_launch_skip: 0
    deep_launch_count: 1
    deep_ncu_set: "basic"
    deep_timeout: 1800

fleet:
  image: "blakeresearch/rola-bench:v37"
  offer_query: "gpu_name=A100_PCIE num_gpus=1 rentable=true reliability>0.97 inet_down>500 inet_down_cost<0.01 inet_up_cost<0.01"
  idle_timeout: 900
  batch: 1
  per_batch_timeout: 7200
