[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fsla-bench"
license = { file = "LICENSE" }
version = "0.1.0"
description = "FSLA's benchmarks on fleet (MQAR) and the local measurement suite"
requires-python = ">=3.10"
# The dependency edges: the benches build FSLA through fla (our fork's FSLA layer wraps fsla), MQAR's model and
# baselines come from zoology, dispatch from fleet, and every result is stored through fsla-results. First-party
# packages come from their own repositories (locally the graph's environments pin them by public commit and a run names
# its fsla checkout, README.md#local-runs; an image installs them from source); they are listed so pip verifies they
# are present.
dependencies = [
    "fsla",          # the model and kernels
    "flash-linear-attention",  # fla, from the fork's fsla branch: FSLA's layer and HF model, and the baseline layers
    "zoology",       # MQAR's model, data and baselines (FSLAMixer wraps fla's FSLA)
    "fleet",         # generic GPU orchestration
    "fsla-results",  # the result store
    "torch",
    "numpy",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["fsla_bench*"]
namespaces = false

[tool.pytest.ini_options]
#: `-p no:cacheprovider`: it writes no `.pytest_cache` into the tree it runs in
addopts = "-p no:cacheprovider"
